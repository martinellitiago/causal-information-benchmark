[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omegad-generators"
version = "0.1.0"
description = "Synthetic discrete mechanisms and conditioning profiles for Omega D"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Tiago Martinelli"}]
dependencies = []

[project.optional-dependencies]
docs = ["sphinx>=7,<9", "sphinx-rtd-theme>=3,<4"]

[tool.setuptools.packages.find]
include = ["omegad*"]
