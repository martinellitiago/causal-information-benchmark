[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-dynamics-generators"
version = "0.2.0"
description = "Synthetic causal mechanisms and independent information measures"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Tiago Martinelli"}]
dependencies = []

[project.optional-dependencies]
docs = ["sphinx>=7,<9", "sphinx-rtd-theme>=3,<4"]

[tool.setuptools.packages.find]
include = ["causal_dynamics*"]
